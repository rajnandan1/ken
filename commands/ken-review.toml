description = "Review changes for Thompson-mode violations: rot, layers, unvouched deps"
prompt = "Review the current code changes for Thompson-mode method violations only, not correctness. One line per finding: L<line>: <tag> <what>. <the move>. Tags: rot (unit on repeated patches — the next fix is a rewrite, name its shape), layer (wrapper/adapter/manager adding no decision — delete it, move callers down a level), unvouched (dependency or pasted code nobody can explain — read it or replace it with a few owned lines), fancy (clever algorithm where the plain loop wins at this scale — name the brute-force form), ceremony (process, abstraction, or config serving itself — remove it). End with the net lines, layers, and dependencies removable. If nothing to flag: 'Sound. Ship it.'"
