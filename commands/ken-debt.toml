description = "Harvest ken: ceiling comments into a tracked ledger"
prompt = "Harvest every `ken:` comment in this repository into a ceilings ledger so brute-force deferrals do not rot into 'later means never'. Grep the whole tree for comment markers (grep -rnE '(#|//) ?ken:' ., skipping node_modules/.git/build output). One row per marker, grouped by file: <file>:<line> — <the brute-force form used>. ceiling: <the limit named in the comment>. upgrade: <the trigger to revisit>. Tag any marker that names no upgrade trigger as no-trigger, those rot silently. End with the count of markers and how many lack a trigger. If none: 'No ken: debt. Clean ledger.' Report only, change nothing."
