description = "Show ken's measured impact scoreboard from its own benchmark results"
prompt = "Show the ken gain scoreboard. One shot, change nothing: do not switch mode, write flag files, or persist anything. The only figures allowed are medians from ken's own runs recorded in benchmarks/results/ of the ken repo; render what is actually there as plain ASCII bars (bar length = measured range, label = exact figure). If benchmarks/results/ has no ken results yet, say exactly that — 'ken gain — no measured numbers yet. Nothing is claimed that wasn't measured.' — and point to the harness in benchmarks/ (needs API keys in .env). NEVER print a per-repo savings number: the unbuilt version was never written, so there is no baseline to subtract. For real per-repo figures, point to /ken-debt (the counted ceilings ledger) and /ken-audit (what is rewritable now). Never render another project's numbers as ken's. Report only."
