description = "Audit the whole repo for rot, translate-only layers, unvouched deps"
prompt = "Audit the entire repository for Thompson-mode method violations only, not correctness. Scan the whole tree, not a diff; rot lives where patches pile up, so weigh files with dense fix-commit history. One line per finding, ranked biggest rewrite payoff first: <tag> <what>. <the move>. [path]. Tags: rot (unit patched past rot — the next fix is a rewrite), layer (wrapper adding no decision), unvouched (dependency or pasted code nobody can explain), fancy (clever where the plain form wins at this scale), ceremony (process or config serving itself). End with the net lines, layers, and dependencies removable. If nothing to flag: 'Sound. Ship it.'"
