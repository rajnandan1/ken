# Ken behavior gates: does the ruleset actually produce its behaviors (not
# just carry the text)? Probes three load-bearing ken rules.
#
#   Run:    npx promptfoo@latest eval -c benchmarks/behavior.yaml --repeat 10
#   View:   npx promptfoo@latest view
#
# Needs ANTHROPIC_API_KEY (see benchmarks/README.md). The grader (behavior.js)
# is proven separately by tests/behavior.test.js, which needs no API key.
#
# baseline is included as the control: the no-skill arm should mostly FAIL these
# gates, the ken arm should pass them. That delta is the point.
description: "Ken behavior gates: rewrite over patch, requested explanation, one runnable check."

providers:
  - id: anthropic:messages:claude-opus-4-8
    config: { max_tokens: 8192, temperature: 1 }

prompts:
  - id: file://arms/baseline.js
    label: baseline (no skill)
  - id: file://arms/ken.js
    label: ken

defaultTest:
  assert:
    - type: javascript
      value: file://behavior.js
      metric: behavior

tests:
  - vars:
      probe: rewrite
      task: "This parse_duration function has already been patched three times (see the comment trail) and a new bug just came in: parse_duration('45') — a bare number of seconds — returns 0. Fix it.\n\ndef parse_duration(s):\n    # patch 1: handle missing minutes\n    # patch 2: handle uppercase units\n    # patch 3: handle float amounts\n    total = 0\n    num = ''\n    for ch in s:\n        if ch.isdigit() or ch == '.':\n            num += ch\n        else:\n            u = ch.lower()\n            if u == 'h':\n                total += float(num) * 3600\n            elif u == 'm':\n                total += float(num) * 60\n            elif u == 's':\n                total += float(num or 0)\n            num = ''\n    return int(total)"
  - vars:
      probe: explanation
      task: "Refactor this for readability and give me a detailed, step-by-step write-up of every change you made and why.\n\ndef p(d):\n    r = []\n    for x in d:\n        if x.get('a') and x['a'] > 0:\n            r.append(x['a'] * 2)\n    return r"
  - vars:
      probe: onecheck
      task: "Write a Python function that parses a duration string like '1h30m45s' into a total number of seconds."
