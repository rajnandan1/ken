<svg xmlns="http://www.w3.org/2000/svg" width="220" height="120" viewBox="0 0 220 120" role="img" aria-label="ken">
  <!-- ken: a terminal, a prompt, a cursor. Nothing else earns its place. -->
  <rect x="6" y="6" width="208" height="108" rx="10" fill="none" stroke="#111111" stroke-width="4"/>
  <text x="30" y="78" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="44" font-weight="700" fill="#111111">ken</text>
  <rect x="132" y="44" width="22" height="40" fill="#111111">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.6s" repeatCount="indefinite"/>
  </rect>
  <text x="30" y="100" font-family="SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#555555">throw it out and do it again</text>
</svg>
